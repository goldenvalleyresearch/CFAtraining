<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golden Valley Research</title>
  <meta name="description" content="Golden Valley Research is being rebuilt. Back soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b1526;
      --navy-2: #12203a;
      --gold: #c9a24b;
      --gold-soft: rgba(201, 162, 75, 0.35);
      --text: #e8e4da;
      --muted: #9aa3b5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at top, var(--navy-2) 0%, var(--navy) 70%);
      background-color: var(--navy);
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
    }
    .mark {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 40px;
    }
    .rule {
      width: 64px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 32px;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(40px, 8vw, 72px);
      line-height: 1.05;
      margin-bottom: 20px;
    }
    p {
      font-size: 17px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 420px;
      margin: 0 auto;
    }
    footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
      opacity: 0.7;
    }
    footer span { color: var(--gold); }
  </style>
</head>
<body>
  <div class="mark">Golden Valley Research</div>
  <div class="rule"></div>
  <h1>Under Renovation</h1>
  <p>The site is being rebuilt from the ground up. Back soon.</p>
  <footer>&copy; 2026 <span>Golden Valley Research</span></footer>
</body>
</html>
